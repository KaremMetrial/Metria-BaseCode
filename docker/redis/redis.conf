###############################################################################
# Redis — Laravel cache / session / queue backend
#
# Authentication is NOT configured here. The entrypoint appends `requirepass`
# from REDIS_PASSWORD (or REDIS_PASSWORD_FILE) at boot, so the secret never
# lives in the image, in this file, or in the process command line.
###############################################################################

# --- Network -----------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes

tcp-backlog 511
tcp-keepalive 300
timeout 0

# --- General -----------------------------------------------------------------
daemonize no
databases 16

# stdout + empty logfile ⇒ the Docker logging driver collects everything.
loglevel notice
logfile ""

# --- Memory ------------------------------------------------------------------
# Keep maxmemory below the container's memory limit: the limit must also cover
# the copy-on-write fork during RDB snapshots and the AOF rewrite buffer.
maxmemory 512mb

# This instance also carries Laravel queues. Evicting arbitrary keys would
# silently discard pending jobs, so capacity pressure must fail writes visibly
# rather than turn into data loss. Use a separate cache-only Redis instance if
# LRU eviction is required.
maxmemory-policy noeviction
maxmemory-samples 5

# --- Persistence: AOF (primary) ----------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# everysec: at most ~1s of writes lost on a hard kill, without the throughput
# collapse of `always` (which fsyncs on every single command).
appendfsync everysec
no-appendfsync-on-rewrite no

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-timestamp-enabled no

# --- Persistence: RDB (secondary, for fast restarts and backups) -------------
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- Latency -----------------------------------------------------------------
# Free large objects on a background thread instead of blocking the event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# --- Observability -----------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# --- Client limits -----------------------------------------------------------
maxclients 10000
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Safety ------------------------------------------------------------------
# FLUSHALL wipes *every* database in one command and no Laravel code path
# issues it — `cache:clear` uses FLUSHDB against the configured connection.
rename-command FLUSHALL ""

# DEBUG can segfault the server on purpose (DEBUG SEGFAULT) and dump internals.
rename-command DEBUG ""

# NOTE: KEYS is deliberately left enabled. It is O(N) and should never appear
# in a request path, but Laravel and several first-party packages do call it,
# so renaming it away breaks the framework rather than an attacker. Use
# `slowlog` (configured above) to find any caller that matters.
#
# NOTE: FLUSHDB is likewise required by `php artisan cache:clear`.
