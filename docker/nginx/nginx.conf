# =============================================================================
# Nginx — main configuration
#
# No `user` directive: the container already runs unprivileged, and setting it
# would make nginx warn (or fail) because it cannot setuid.
# =============================================================================

worker_processes        auto;
worker_rlimit_nofile    65535;

pid                     /tmp/nginx.pid;

error_log               /dev/stderr warn;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # -------------------------------------------------------------------------
    # Core
    # -------------------------------------------------------------------------
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    charset             utf-8;

    # Never advertise the version, in headers or on error pages.
    server_tokens       off;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;

    keepalive_timeout   65s;
    keepalive_requests  1000;
    reset_timedout_connection on;

    types_hash_max_size     2048;
    server_names_hash_bucket_size 128;
    variables_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Request limits — must be >= PHP's post_max_size (108M) or nginx rejects
    # large uploads before PHP ever sees them.
    # -------------------------------------------------------------------------
    client_max_body_size        100M;
    client_body_buffer_size     256k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;

    client_body_timeout         60s;
    client_header_timeout       60s;
    send_timeout                60s;

    # -------------------------------------------------------------------------
    # Scratch paths under /tmp so the rootfs can stay read-only
    #
    # Single level deep on purpose. nginx creates these at startup with one
    # mkdir() per path and does NOT create intermediate parents, so a nested
    # /tmp/nginx/client_body fails with ENOENT the moment /tmp is a fresh
    # tmpfs — which is exactly what the read-only rootfs setup gives it.
    # -------------------------------------------------------------------------
    client_body_temp_path   /tmp/nginx_client_body;
    proxy_temp_path         /tmp/nginx_proxy;
    fastcgi_temp_path       /tmp/nginx_fastcgi;
    uwsgi_temp_path         /tmp/nginx_uwsgi;
    scgi_temp_path          /tmp/nginx_scgi;

    # -------------------------------------------------------------------------
    # Logging — structured, to stdout/stderr, for the Docker logging driver
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';

    access_log /dev/stdout json_combined buffer=32k flush=5s;

    # -------------------------------------------------------------------------
    # Rate limiting
    #
    # Zones are declared here and *applied* per-location in the server block.
    # Deliberately generous: limits tight enough to be interesting are also
    # tight enough to break asset-heavy page loads and CI runs.
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=general:16m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=api:16m     rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:16m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:16m;

    limit_req_status  429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Upstream
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/gzip.conf;

    include /etc/nginx/conf.d/*.conf;
}
