# =============================================================================
# FastCGI → PHP-FPM
# =============================================================================

include                 fastcgi_params;

# PATH_INFO support, needed for routes of the form /index.php/foo.
fastcgi_split_path_info ^(.+\.php)(/.*)$;
fastcgi_param           PATH_INFO $fastcgi_path_info;

# $realpath_root (not $document_root) resolves symlinks, so opcache keys on the
# real path. With atomic symlink-swap deploys, $document_root would make PHP
# cache entries for a release directory that no longer exists.
fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
fastcgi_param           DOCUMENT_ROOT   $realpath_root;

# Propagate the request id so application logs can be joined to access logs.
fastcgi_param           HTTP_X_REQUEST_ID $request_id;

fastcgi_index           index.php;

# Reuse upstream connections (requires `keepalive` on the upstream block).
fastcgi_keep_conn       on;

fastcgi_connect_timeout 10s;
fastcgi_send_timeout    120s;
fastcgi_read_timeout    120s;

fastcgi_buffering       on;
fastcgi_buffer_size     32k;
fastcgi_buffers         16 32k;
fastcgi_busy_buffers_size 64k;

# Serve a stale-free error rather than a truncated page if a worker dies.
fastcgi_intercept_errors off;
fastcgi_next_upstream   error timeout invalid_header http_500 http_503;
fastcgi_next_upstream_tries 2;

# Never let PHP's own error output leak framework internals to the client;
# it is captured by the container log instead.
fastcgi_hide_header     X-Powered-By;
