# =============================================================================
# Filesystem hardening
#
# The document root is public/, so application code, .env and vendor/ are
# already outside the served tree — this is defence in depth for the case
# where someone points the root at the project directory by mistake, or a
# package writes something unexpected into public/.
# =============================================================================

# Dotfiles: .env, .git, .htaccess, .DS_Store …
# ACME http-01 challenges live under /.well-known and must stay reachable.
location ~ /\.(?!well-known\/) {
    deny            all;
    access_log      off;
    log_not_found   off;
    return          404;
}

# Anything that should never be web-served even if it lands in public/.
location ~* \.(?:env|log|sql|sqlite|bak|old|orig|save|swp|swo|dist|ini|conf|sh|lock|yml|yaml|toml|neon)$ {
    deny            all;
    access_log      off;
    log_not_found   off;
    return          404;
}

location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|artisan|phpunit\.xml|Dockerfile|Makefile)$ {
    deny            all;
    access_log      off;
    return          404;
}

# PHP-FPM's own status/ping endpoints must never be reachable from outside.
location ~* ^/(?:status|ping|fpm-status|fpm-ping)$ {
    deny            all;
    access_log      off;
    return          404;
}

# Directories that must never be exposed, belt-and-braces.
location ~* ^/(?:storage/framework|storage/logs|vendor|node_modules|bootstrap/cache|tests|database)/ {
    deny            all;
    access_log      off;
    return          404;
}
