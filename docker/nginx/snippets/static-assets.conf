# =============================================================================
# Static asset delivery — shared behaviour only
#
# Cache lifetime is deliberately NOT set here. Each location sets its own
# `expires`/`Cache-Control`; if this file also set them, the caller's
# add_header would *append* rather than replace and the response would carry
# two conflicting Cache-Control headers.
# =============================================================================

access_log      off;
log_not_found   off;

# Re-assert security headers: a location that declares any add_header of its
# own stops inheriting the server-level ones.
include         /etc/nginx/snippets/security-headers.conf;

open_file_cache          max=3000 inactive=120s;
open_file_cache_valid    45s;
open_file_cache_min_uses 2;
open_file_cache_errors   off;
