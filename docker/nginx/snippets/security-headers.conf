# =============================================================================
# Security response headers
#
# `always` is required — without it nginx omits the header on 4xx/5xx
# responses, which are exactly the ones an attacker is most likely to see.
#
# Caveat: add_header is *not* inherited into a location block that declares its
# own add_header. Every location that adds headers must re-include this file.
# =============================================================================

# Clickjacking. CSP frame-ancestors supersedes this for modern browsers; both
# are sent because they fail differently on older ones.
add_header X-Frame-Options            "SAMEORIGIN" always;

# Stop content-type sniffing (the classic "upload .jpg, execute as .html").
add_header X-Content-Type-Options     "nosniff" always;

# Don't leak full URLs (which may contain tokens) to third-party origins.
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

# Opt out of powerful features the app does not use.
add_header Permissions-Policy         "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# Cross-origin isolation posture.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Trace-back handle that also appears in the JSON access log.
add_header X-Request-Id               $request_id always;

# -----------------------------------------------------------------------------
# Deliberately NOT enabled by default
# -----------------------------------------------------------------------------
# HSTS — only meaningful over TLS, and a wrong max-age is not revocable. Enable
# once HTTPS is terminated *here* rather than at an upstream load balancer:
#
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# CSP — cannot be set generically without breaking Vite's dev client and any
# inline bootstrapping. Start in report-only mode and tighten per application:
#
#   add_header Content-Security-Policy-Report-Only "default-src 'self'" always;
#
# X-XSS-Protection is intentionally omitted: it is removed from all current
# browsers, and its legacy filter was itself exploitable.
