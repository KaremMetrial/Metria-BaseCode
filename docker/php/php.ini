; =============================================================================
; Laravel — shared PHP configuration (loaded first, as 00-laravel.ini)
; Environment-specific overrides live in 20-development.ini / 20-production.ini
; =============================================================================

[PHP]
engine                  = On
short_open_tag          = Off
expose_php              = Off
default_charset         = UTF-8
date.timezone           = UTC

; --- Resource limits ---------------------------------------------------------
; Laravel's CLI (queue/scheduler/artisan) overrides memory_limit to -1 via
; entrypoint where required; 512M is the request-scoped web ceiling.
memory_limit            = 512M
max_execution_time      = 120
max_input_time          = 120
max_input_vars          = 5000

; --- Uploads -----------------------------------------------------------------
file_uploads            = On
upload_max_filesize     = 100M
post_max_size           = 108M
max_file_uploads        = 40

; --- Errors (defaults are production-safe; dev ini relaxes them) --------------
display_errors          = Off
display_startup_errors  = Off
log_errors              = On
error_log               = /proc/self/fd/2
; E_STRICT is intentionally absent: the constant is deprecated in PHP 8.4 and
; has had no effect since 8.0, but naming it here still triggers a startup
; deprecation notice.
error_reporting         = E_ALL & ~E_DEPRECATED
html_errors             = Off
log_errors_max_len      = 4096
ignore_repeated_errors  = Off
report_memleaks         = On

; --- Security ----------------------------------------------------------------
cgi.fix_pathinfo        = 0
allow_url_fopen         = On
allow_url_include       = Off

; NOTE: pcntl_* and proc_* are NOT disabled here, and that is deliberate.
; This ini is shared by every SAPI in the image, and the CLI processes need
; them: `queue:work` uses pcntl_signal/pcntl_async_signals to catch SIGTERM
; and finish the job in flight instead of being killed mid-write. Disabling
; them globally silently converts every graceful shutdown into a hard kill.
;
; The restriction belongs to the web SAPI only, so it lives in the FPM pool
; instead — see `php_admin_value[disable_functions]` in www.conf.

; --- Filesystem performance --------------------------------------------------
realpath_cache_size     = 4096K
realpath_cache_ttl      = 600

; --- Sessions (Laravel drives its own session store; these are fallbacks) ----
;
; session.sid_length and session.sid_bits_per_character are NOT set: both are
; deprecated as of PHP 8.4 and emit a startup warning on every SAPI launch.
; Laravel generates its own 40-character session identifier anyway, so these
; only ever applied to native PHP sessions.
[Session]
session.save_handler        = files
session.use_strict_mode     = 1
session.use_cookies         = 1
session.use_only_cookies    = 1
session.cookie_httponly     = 1
session.cookie_samesite     = Lax
session.gc_maxlifetime      = 7200

[Assertion]
zend.assertions         = -1

; NOTE: there is deliberately no [mbstring] section. mbstring.http_input,
; mbstring.http_output and mbstring.internal_encoding are all deprecated in
; modern PHP; each one makes PHP print a deprecation notice at startup, which
; breaks tooling that treats stderr output during module loading as a failure
; (the PECL extension installer does exactly that). `default_charset = UTF-8`
; above already sets the encoding mbstring uses.
