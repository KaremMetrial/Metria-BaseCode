; =============================================================================
; PHP-FPM pool: www
;
; No `user`/`group` directives on purpose: the container already starts as the
; unprivileged app user (or the entrypoint drops to it via gosu), so setting
; them here would only emit "directive is ignored when FPM is not running as
; root" warnings on every boot.
; =============================================================================

[www]

; --- Socket ------------------------------------------------------------------
listen                      = 0.0.0.0:9000
listen.backlog              = 4096

; --- Process manager ---------------------------------------------------------
; `dynamic` suits mixed traffic. For a fixed-size production pod, switch to
; `static` with pm.max_children = (container_memory / avg_process_memory).
pm                          = dynamic
pm.max_children             = 20
pm.start_servers            = 4
pm.min_spare_servers        = 2
pm.max_spare_servers        = 8
pm.max_spawn_rate           = 4
pm.process_idle_timeout     = 30s

; Recycle workers to bound the effect of any slow leak in userland code.
pm.max_requests             = 500

; --- Introspection (blocked at the edge by nginx; see snippets/security.conf) -
pm.status_path              = /status
ping.path                   = /ping
ping.response               = pong

; --- Timeouts ----------------------------------------------------------------
request_terminate_timeout   = 120s
request_slowlog_timeout     = 5s
slowlog                     = /proc/self/fd/2

; --- Logging -----------------------------------------------------------------
; Workers' stdout/stderr is forwarded to the FPM master, which the Docker
; logging driver collects. `decorate_workers_output = no` keeps it parseable.
catch_workers_output        = yes
decorate_workers_output     = no

; Laravel reads configuration from the process environment.
clear_env                   = no

; --- Hardening (web SAPI only) -----------------------------------------------
; Process-control and process-spawning functions have no legitimate use inside
; a web request, and they are the first thing reached for after an RCE. They
; are blocked here rather than in php.ini so that the CLI containers — the
; queue worker in particular, which needs pcntl_signal for graceful shutdown —
; keep full access. php_admin_value cannot be overridden with ini_set().
;
; RELAX THIS if the application shells out during a web request: PDF renderers
; (Browsershot, wkhtmltopdf, Snappy), some backup packages and a few image
; pipelines call proc_open/exec directly. Symptom is a "call to undefined
; function" or a silently empty result — remove the offending name from this
; list rather than deleting the whole line.
php_admin_value[disable_functions] = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals,exec,passthru,shell_exec,system,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,popen,dl

; NOTE: open_basedir is deliberately NOT set. It reads like free hardening, but
; it breaks Composer, intl/ICU data lookups and several stream wrappers in ways
; that surface much later as confusing runtime errors, and it defeats the
; realpath cache. Container + read-only rootfs + non-root user already bound the
; filesystem far more effectively. Add it per-application if you need it.

; --- Baseline environment ----------------------------------------------------
env[HOSTNAME]   = $HOSTNAME
env[PATH]       = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[TMP]        = /tmp
env[TMPDIR]     = /tmp
env[TEMP]       = /tmp
