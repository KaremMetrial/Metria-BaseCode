; =============================================================================
; OPcache — baseline (10-opcache.ini)
; validate_timestamps is deliberately left ON here and switched OFF by
; 20-production.ini, so an accidentally-missing prod ini fails *safe*
; (slightly slower) rather than serving permanently stale bytecode.
; =============================================================================

[opcache]
opcache.enable                  = 1

; Enabled for CLI too, because the queue worker and scheduler are long-lived
; CLI processes — without this they re-compile the whole framework on every
; job. The cost for short-lived `artisan` invocations is a few milliseconds.
opcache.enable_cli              = 1

opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 30000
opcache.max_wasted_percentage   = 10

opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 0
opcache.revalidate_path         = 0

opcache.save_comments           = 1
opcache.record_warnings         = 0
opcache.huge_code_pages         = 0
opcache.file_cache_only         = 0

; JIT is off by default: for typical Laravel request/response workloads it
; yields little and occasionally regresses. Flip to `tracing` and benchmark
; your own workload before enabling in production.
opcache.jit                     = disable
opcache.jit_buffer_size         = 0
