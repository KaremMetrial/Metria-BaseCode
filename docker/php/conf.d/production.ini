; =============================================================================
; Production overrides (20-production.ini) — production stage only
; =============================================================================

display_errors          = Off
display_startup_errors  = Off
log_errors              = On
error_log               = /proc/self/fd/2
error_reporting         = E_ALL & ~E_DEPRECATED
html_errors             = Off

expose_php              = Off
zend.assertions         = -1

; Immutable code in the image ⇒ never stat the filesystem for changes.
opcache.enable              = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq     = 0
opcache.save_comments       = 1
opcache.max_accelerated_files = 30000
opcache.memory_consumption  = 256
opcache.interned_strings_buffer = 32

; Fail fast instead of hanging a worker on a wedged upstream.
default_socket_timeout  = 30
mysqlnd.collect_statistics = 0
