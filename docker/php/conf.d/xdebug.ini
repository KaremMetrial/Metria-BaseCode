; =============================================================================
; Xdebug (30-xdebug.ini) — development stage only
;
; Off by default: loading Xdebug in `debug` mode all the time costs ~2-5x on
; every request. Enable per-session instead:
;     XDEBUG_MODE=debug make shell
; or set XDEBUG_MODE in .env.docker and `make restart`.
; =============================================================================

xdebug.mode              = off
xdebug.start_with_request = trigger
xdebug.client_host       = host.docker.internal
xdebug.client_port       = 9003
xdebug.idekey            = VSCODE
xdebug.max_nesting_level = 512
xdebug.log_level         = 0
xdebug.discover_client_host = 0
