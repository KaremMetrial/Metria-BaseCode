; =============================================================================
; Development overrides (20-development.ini) — development stage only
; =============================================================================

display_errors          = On
display_startup_errors  = On
error_reporting         = E_ALL
html_errors             = On

memory_limit            = 1G
max_execution_time      = 0

zend.assertions         = 1
assert.exception        = 1

; Source changes must be picked up immediately behind a bind mount.
opcache.enable          = 1
opcache.enable_cli      = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug/step-debugging and profilers need the real pcntl surface in dev.
disable_functions       =
