; =============================================================================
; Scheduler
;
; `schedule:work` is the container-native replacement for a crontab entry: it
; stays in the foreground and dispatches due tasks every minute. Exactly one
; replica of this service may run — two schedulers means every scheduled task
; fires twice. See docs in README (Production deployment) before scaling.
; =============================================================================

[program:scheduler]
command         = php /var/www/html/artisan schedule:work --no-interaction
process_name    = %(program_name)s
numprocs        = 1
directory       = /var/www/html

autostart       = true
autorestart     = true
startsecs       = 5
startretries    = 10

stopsignal      = TERM
stopwaitsecs    = 90
stopasgroup     = true
killasgroup     = true

redirect_stderr = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
