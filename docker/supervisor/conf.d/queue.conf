; =============================================================================
; Queue worker
;
; --max-time / --max-jobs / --memory make each worker deliberately short-lived.
; A long-lived PHP worker accumulates state and leaks; recycling it is cheaper
; and far more predictable than hunting the leak. Supervisor restarts it
; immediately, so throughput is unaffected.
;
; `stopwaitsecs` must exceed the longest job runtime, otherwise SIGKILL will
; tear a worker down mid-job and the job will be retried as a duplicate.
; =============================================================================

[program:queue]
command         = php /var/www/html/artisan queue:work
                  --queue=%(ENV_QUEUE_NAME)s
                  --tries=%(ENV_QUEUE_TRIES)s
                  --backoff=%(ENV_QUEUE_BACKOFF)s
                  --timeout=%(ENV_QUEUE_TIMEOUT)s
                  --sleep=%(ENV_QUEUE_SLEEP)s
                  --max-time=%(ENV_QUEUE_MAX_TIME)s
                  --max-jobs=%(ENV_QUEUE_MAX_JOBS)s
                  --memory=%(ENV_QUEUE_MEMORY)s
                  --no-interaction

process_name    = %(program_name)s_%(process_num)02d
numprocs        = %(ENV_QUEUE_WORKERS)s
directory       = /var/www/html

autostart       = true
autorestart     = true
startsecs       = 5
startretries    = 10

; Laravel's worker handles SIGTERM as "finish the current job, then exit".
stopsignal      = TERM
stopwaitsecs    = 120
stopasgroup     = true
killasgroup     = true

redirect_stderr = true
stdout_logfile          = /dev/stdout
stdout_logfile_maxbytes = 0
