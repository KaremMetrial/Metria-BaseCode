; =============================================================================
; Supervisor — base configuration
;
; One image serves both the queue and the scheduler. Rather than shipping every
; program definition into every container (which would make the queue container
; also run the scheduler, and vice versa), the include path is selected by
; SUPERVISOR_ROLE at runtime.
;
;   SUPERVISOR_ROLE=queue      → conf.d/queue.conf
;   SUPERVISOR_ROLE=scheduler  → conf.d/scheduler.conf
;
; Everything is rooted in /tmp so the container can run unprivileged and, if
; desired, with a read-only root filesystem.
; =============================================================================

[supervisord]
nodaemon                = true
logfile                 = /dev/stdout
logfile_maxbytes        = 0
loglevel                = info
pidfile                 = /tmp/supervisord.pid
childlogdir             = /tmp
directory               = /var/www/html
strip_ansi              = true

[unix_http_server]
file                    = /tmp/supervisor.sock
chmod                   = 0700

[supervisorctl]
serverurl               = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /etc/supervisor/conf.d/%(ENV_SUPERVISOR_ROLE)s.conf
