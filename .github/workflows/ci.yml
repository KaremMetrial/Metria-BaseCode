name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, redis, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse
        continue-on-error: true

      - name: Tests
        run: php artisan test

  realtime-cluster-integration:
    name: realtime-cluster-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/realtime/package-lock.json

      - name: Install realtime test dependencies
        working-directory: services/realtime
        run: npm ci

      - name: Two-node Redis and Socket.IO production gate
        working-directory: services/realtime
        run: npm run test:integration:cluster
