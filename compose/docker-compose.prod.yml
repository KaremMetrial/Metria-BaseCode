services:
  mysql:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-4}"
          memory: "${DB_MEMORY_LIMIT:-4g}"
        reservations:
          memory: "${DB_MEMORY_RESERVATION:-1g}"

  redis:
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=64m
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1}"
          memory: "${REDIS_MEMORY_LIMIT:-1g}"

  app:
    build:
      target: production
    restart: always
    read_only: true
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      APP_KEY: "${APP_KEY:?APP_KEY is required for production}"
      APP_ENV: production
      APP_DEBUG: "false"
    tmpfs:
      - /tmp:rw,mode=1777,size=64m
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-2}"
          memory: "${APP_MEMORY_LIMIT:-1g}"
        reservations:
          memory: "${APP_MEMORY_RESERVATION:-256m}"

  nginx:
    build:
      target: production
      additional_contexts:
        app_image: "service:app"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-1}"
          memory: "${NGINX_MEMORY_LIMIT:-256m}"

  queue:
    restart: always
    read_only: true
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      APP_KEY: "${APP_KEY:?APP_KEY is required for production}"
      APP_ENV: production
      APP_DEBUG: "false"
    tmpfs:
      - /tmp:rw,mode=1777,size=64m
    deploy:
      resources:
        limits:
          cpus: "${QUEUE_CPU_LIMIT:-2}"
          memory: "${QUEUE_MEMORY_LIMIT:-1g}"

  scheduler:
    restart: always
    read_only: true
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      APP_KEY: "${APP_KEY:?APP_KEY is required for production}"
      APP_ENV: production
      APP_DEBUG: "false"
    tmpfs:
      - /tmp:rw,mode=1777,size=64m
    deploy:
      resources:
        limits:
          cpus: "${SCHEDULER_CPU_LIMIT:-1}"
          memory: "${SCHEDULER_MEMORY_LIMIT:-512m}"

  realtime:
    restart: always
    environment:
      NODE_ENV: production
      REALTIME_ALLOWED_ORIGINS: "${REALTIME_ALLOWED_ORIGINS:?REALTIME_ALLOWED_ORIGINS is required for production}"
      REALTIME_INTERNAL_SECRET: "${REALTIME_INTERNAL_SECRET:?REALTIME_INTERNAL_SECRET is required for production}"
      REALTIME_EVENT_HMAC_SECRET: "${REALTIME_EVENT_HMAC_SECRET:?REALTIME_EVENT_HMAC_SECRET is required for production}"
      REALTIME_REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=32m
    deploy:
      resources:
        limits:
          cpus: "${REALTIME_CPU_LIMIT:-1}"
          memory: "${REALTIME_MEMORY_LIMIT:-256m}"
